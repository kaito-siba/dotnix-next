# Daily: vulnix (NVD) + OSV + GitHub advisories over every host's closure.
# Report-only by default; set the repository variable SECURITY_ISSUES=true to
# turn persistent new findings into Issues, and SECURITY_FASTLANE=true to let
# the scan dispatch the nixpkgs update when the channel is already ahead.
name: daily-security

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      issues:
        description: open/close Issues for persistent findings
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: daily-security
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            accept-flake-config = false
      - name: NVD feed cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vulnix
          key: vulnix-nvd-${{ github.run_id }}
          restore-keys: vulnix-nvd-
      - name: closure of every host
        run: python3 security/scripts/closure.py /tmp/closure.json
      - name: earlier results (persistence rule)
        run: |
          mkdir -p /tmp/history
          for id in $(gh run list --workflow daily-security.yml --status success --limit 14 --json databaseId --jq '.[].databaseId'); do
            gh run download "$id" -n scan-results -D "/tmp/history/$id" 2>/dev/null || true
          done
          find /tmp/history -name '*.json' -exec cp {} /tmp/history/ \; 2>/dev/null || true
          ls /tmp/history
      - name: scan
        run: |
          mkdir -p results
          flags=""
          if [ "${{ vars.SECURITY_ISSUES }}" = "true" ] || [ "${{ inputs.issues }}" = "true" ]; then flags="$flags --issues"; fi
          if [ "${{ vars.SECURITY_FASTLANE }}" = "true" ]; then flags="$flags --fastlane"; fi
          nix shell --inputs-from . nixpkgs#vulnix -c \
            python3 security/scripts/scan.py --closure /tmp/closure.json --lock flake.lock \
              --out "results/$(date -u +%F).json" --history /tmp/history --summary /tmp/summary.md $flags
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-results
          path: results/
          retention-days: 90
