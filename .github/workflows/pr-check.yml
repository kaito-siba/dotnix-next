# Every PR: all hosts must evaluate. When flake.lock moved, the changed inputs
# (transitive ones included) must also satisfy the cooling period, unless the
# PR carries the `security-fastlane` label (a known CVE fix that should not
# wait). Label changes re-run the check so the label actually takes effect.
name: pr-check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            accept-flake-config = false
      - run: python3 security/scripts/closure.py /tmp/closure.json

  cooling:
    if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'security-fastlane') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: cooling period on changed inputs
        run: |
          git show "origin/${{ github.base_ref }}:flake.lock" > /tmp/before.lock
          python3 security/scripts/cooling.py flake.lock /tmp/before.lock | tee -a "$GITHUB_STEP_SUMMARY"
